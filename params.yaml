
data:
  url: https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv
  raw_path: data/raw/churn.csv
  test_size: 0.2
  random_state: 42

train:
  model: random_forest
  n_estimators: 200
  max_depth: 6
  min_samples_leaf: 5
  C: 1.0
  random_state: 42

evaluate:
  min_f1: 0.90
